<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    Lineas de codigo, una encontrada. Las tintas van literales porque el
    favicon se pide como documento aparte y no ve los tokens de src/index.css.
    Son los valores de ese archivo: si la paleta cambia, se cambian a mano.
  -->
  <style>
    .ground { fill: #fcfcfb }
    .pencil { stroke: #6e6c68 }
    .signal { stroke: #0e6a86 }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #121211 }
      .pencil { stroke: #97948f }
      .signal { stroke: #5fb2ce }
    }
    line { fill: none; stroke-linecap: round }
  </style>

  <rect class="ground" width="32" height="32" rx="2"/>
  <line class="pencil" x1="6" y1="9.5" x2="20" y2="9.5" stroke-width="1.5"/>
  <line class="signal" x1="10" y1="16" x2="26" y2="16" stroke-width="2"/>
  <line class="pencil" x1="10" y1="22.5" x2="22" y2="22.5" stroke-width="1.5"/>
</svg>
