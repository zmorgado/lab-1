[project]
name = "snippet-search"
version = "0.1.0"
description = "Snippet search pipeline for LAB #1: paste code, find equivalent code on GitHub."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "psutil>=6.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
    # 0.26.0 corrompe memoria al recorrer arboles grandes (segfault con
    # textwrap.py de la stdlib); 0.25.2 los recorre bien
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25.0",
]

# 'uv run snippet-search' levanta el servicio sin tener que recordar el
# modulo de uvicorn
[project.scripts]
snippet-search = "snippet_search.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

# El backend existe como paquete instalable (no solo un directorio de scripts)
# para que 'uv sync' lo instale editable: los tests importan snippet_search
# igual que lo va a hacer uvicorn en produccion, sin depender del cwd.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snippet_search"]

[tool.pytest.ini_options]
# 'tests' es la raiz de la suite. El paquete se instala editable (src layout),
# pero conftest.py igual asegura 'src/' en sys.path: ver el comentario de ahi.
testpaths = ["tests"]
# Los tests del cliente HTTP y de los endpoints son async: 'auto' evita tener que
# marcar cada uno con @pytest.mark.asyncio
asyncio_mode = "auto"
